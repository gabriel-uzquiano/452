<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="Existence lemma: if diamond phi is in Gamma, the set of phi together with everything boxed in Gamma is consistent and extends to a maximal consistent Delta accessible from Gamma." role="img" width="800" height="360" viewBox="0 0 800 360">
  <defs>
    <marker id="a" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#343a40"/></marker>
    <marker id="b" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#2780e3"/></marker>
  </defs>
  <g font-family="Georgia, &apos;Times New Roman&apos;, &apos;DejaVu Serif&apos;, serif">
    <rect x="55.0" y="108.0" width="190" height="144" rx="14" fill="#f4f6f8" stroke="#343a40" stroke-width="1.8"/>
    <text x="150" y="96.0" font-size="26" fill="#343a40" font-style="italic" text-anchor="middle">Γ</text>
    <text x="150" y="146.0" font-size="21" fill="#2780e3" text-anchor="middle">◇φ</text>
    <text x="150" y="176.0" font-size="21" fill="#343a40" text-anchor="middle">□ψ₁</text>
    <text x="150" y="206.0" font-size="21" fill="#343a40" text-anchor="middle">□ψ₂</text>
    <text x="150" y="236.0" font-size="21" fill="#343a40" text-anchor="middle">⋮</text>
    <rect x="485.0" y="100.0" width="250" height="60" rx="10" fill="#fff" stroke="#343a40" stroke-width="1.8"/>
    <text x="610" y="137" font-size="19" fill="#343a40" text-anchor="middle">{φ} ∪ {ψ : □ψ ∈ Γ}</text>
    <text x="610" y="195" font-size="16" fill="#6c757d" font-style="italic" text-anchor="middle">extend by Lindenbaum</text>
    <rect x="485.0" y="263.0" width="250" height="54" rx="14" fill="#f4f6f8" stroke="#2780e3" stroke-width="1.8"/>
    <text x="610" y="251.0" font-size="26" fill="#2780e3" font-style="italic" text-anchor="middle"></text>
    <text x="610" y="301.0" font-size="21" fill="#343a40" text-anchor="middle">φ, ψ₁, ψ₂, …</text>
    <text x="750" y="295" font-size="26" fill="#2780e3" font-style="italic" text-anchor="start">Δ</text>
    <line x1="610" y1="162" x2="610" y2="252" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
    <line x1="250" y1="220" x2="482" y2="290" stroke="#2780e3" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#b)"/>
    <text x="336.0" y="285.0" font-size="19" fill="#2780e3" font-style="italic" text-anchor="middle">Γ R Δ</text>
  </g>
</svg>
