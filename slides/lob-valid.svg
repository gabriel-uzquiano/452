    <text fill="#2780e3" font-size="20" font-style="italic" text-anchor="start" x="538.4" y="276">p</text>
    <rect fill="none" height="11.2" stroke="#b3261e" stroke-width="1.6" width="11.2" x="522.0" y="307.8"/>
