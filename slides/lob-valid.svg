<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="Loeb holds on transitive converse well-founded frames. If box p fails at w, the set X of worlds w sees where p fails is non-empty and has an R-maximal element v. Every world v sees is seen by w by transitivity and lies outside X, so p holds there and box p holds at v, while p fails at v. So box of box p implies p fails at w." height="420" role="img" viewBox="25 45 735 420" width="735">
