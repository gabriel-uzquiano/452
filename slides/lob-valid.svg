    <text fill="#b3261e" font-size="13" text-anchor="start" x="40.0" y="172">w sees v</text>
    <text fill="#6c757d" font-size="17" text-anchor="start" x="32.0" y="72">(⇐)  R transitive and converse well-founded</text>
