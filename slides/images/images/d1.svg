<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 412" width="460" height="412" role="img" aria-label="A possible worlds model with four worlds. w1 accesses w3; w2 accesses w4; w4 accesses w3; w3 accesses itself. p is true at w3 and w4; q is true at w2 and w4.">
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#343a40"/>
    </marker>
  </defs>

  <g stroke="#343a40" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <line x1="243" y1="75"  x2="325" y2="163"/>
    <line x1="75"  y1="213" x2="173" y2="305"/>
    <line x1="225" y1="307" x2="323" y2="215"/>
    <path d="M 374 166 C 438 140 438 240 374 214"/>
  </g>

  <g fill="#8a8d90" stroke="#343a40" stroke-width="1.6">
    <circle cx="220" cy="50"  r="34"/>
    <circle cx="50"  cy="190" r="34"/>
    <circle cx="350" cy="190" r="34"/>
    <circle cx="200" cy="330" r="34"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#000" text-anchor="middle">
    <text x="218" y="57">w<tspan font-size="16" dx="-3" dy="7">1</tspan></text>
    <text x="48"  y="197">w<tspan font-size="16" dx="-3" dy="7">2</tspan></text>
    <text x="348" y="197">w<tspan font-size="16" dx="-3" dy="7">3</tspan></text>
    <text x="198" y="337">w<tspan font-size="16" dx="-3" dy="7">4</tspan></text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#343a40" text-anchor="middle">
    <text x="50"  y="252">q</text>
    <text x="350" y="252">p</text>
    <text x="200" y="390">p<tspan dx="8">q</tspan></text>
  </g>
</svg>
