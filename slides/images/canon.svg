<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="Sketch of a canonical model: worlds are maximal consistent sets, connected by the canonical relation." role="img" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <marker id="a" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#343a40"/></marker>
    <marker id="b" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#2780e3"/></marker>
  </defs>
  <g font-family="Georgia, &apos;Times New Roman&apos;, &apos;DejaVu Serif&apos;, serif">
    <ellipse cx="140" cy="190" rx="70" ry="44" fill="#f4f6f8" stroke="#343a40" stroke-width="1.8"/>
    <text x="140" y="199" font-size="26" fill="#000" font-style="italic" text-anchor="middle">Γ</text>
    <ellipse cx="400" cy="90" rx="70" ry="44" fill="#f4f6f8" stroke="#343a40" stroke-width="1.8"/>
    <text x="400" y="99" font-size="26" fill="#000" font-style="italic" text-anchor="middle">Δ</text>
    <ellipse cx="400" cy="290" rx="70" ry="44" fill="#f4f6f8" stroke="#343a40" stroke-width="1.8"/>
    <text x="400" y="299" font-size="26" fill="#000" font-style="italic" text-anchor="middle">Θ</text>
    <ellipse cx="660" cy="190" rx="70" ry="44" fill="#f4f6f8" stroke="#343a40" stroke-width="1.8"/>
    <text x="660" y="199" font-size="26" fill="#000" font-style="italic" text-anchor="middle">Λ</text>
    <line x1="206" y1="170" x2="334" y2="108" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
    <line x1="206" y1="210" x2="334" y2="272" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
    <line x1="466" y1="108" x2="598" y2="170" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
    <line x1="400" y1="136" x2="400" y2="244" stroke="#343a40" stroke-width="2" marker-end="url(#a)"/>
    <text x="140" y="265" font-size="16" fill="#6c757d" text-anchor="middle">p ∈ Γ  iff  Γ ∈ V(p)</text>
    <text x="400" y="375" font-size="17" fill="#6c757d" font-style="italic" text-anchor="middle">worlds: all maximal Σ-consistent sets</text>
  </g>
</svg>
