<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="Canonical frame for D systems is serial: every Gamma sees some Delta." role="img" width="620" height="280" viewBox="0 0 620 280">
  <defs>
    <marker id="a" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#343a40"/></marker>
    <marker id="b" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#2780e3"/></marker>
  </defs>
  <g font-family="Georgia, &apos;Times New Roman&apos;, &apos;DejaVu Serif&apos;, serif">
    <ellipse cx="130" cy="160" rx="72" ry="46" fill="#f4f6f8" stroke="#343a40" stroke-width="1.8"/>
    <text x="130" y="169" font-size="26" fill="#343a40" font-style="italic" text-anchor="middle">Γ</text>
    <text x="130" y="236" font-size="19" fill="#343a40" text-anchor="middle">□⊥ ∉ Γ</text>
    <ellipse cx="480" cy="160" rx="72" ry="46" fill="#f4f6f8" stroke="#2780e3" stroke-width="1.8"/>
    <text x="480" y="169" font-size="26" fill="#2780e3" font-style="italic" text-anchor="middle">Δ</text>
    <text x="480" y="236" font-size="19" fill="#343a40" text-anchor="middle">{φ : □φ ∈ Γ} ⊆ Δ</text>
    <line x1="206" y1="160" x2="402" y2="160" stroke="#2780e3" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#b)"/>
    <text x="304.0" y="148.0" font-size="19" fill="#2780e3" font-style="italic" text-anchor="middle">?</text>
  </g>
</svg>
