<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="A maximal consistent set pictured as a world listing its formulas, with its key properties." role="img" width="760" height="340" viewBox="0 0 760 340">
  <defs>
    <marker id="a" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#343a40"/></marker>
    <marker id="b" markerHeight="7" markerWidth="9" orient="auto-start-reverse" refX="9" refY="4" viewBox="0 0 10 8"><path d="M 0 0 L 10 4 L 0 8 z" fill="#2780e3"/></marker>
  </defs>
  <g font-family="Georgia, &apos;Times New Roman&apos;, &apos;DejaVu Serif&apos;, serif">
    <rect x="65.0" y="78.0" width="190" height="204" rx="14" fill="#f4f6f8" stroke="#343a40" stroke-width="1.8"/>
    <text x="160" y="66.0" font-size="26" fill="#343a40" font-style="italic" text-anchor="middle">Γ</text>
    <text x="160" y="116.0" font-size="21" fill="#343a40" text-anchor="middle">p</text>
    <text x="160" y="146.0" font-size="21" fill="#343a40" text-anchor="middle">¬q</text>
    <text x="160" y="176.0" font-size="21" fill="#343a40" text-anchor="middle">p → r</text>
    <text x="160" y="206.0" font-size="21" fill="#343a40" text-anchor="middle">□(q ∨ s)</text>
    <text x="160" y="236.0" font-size="21" fill="#343a40" text-anchor="middle">◇¬p</text>
    <text x="160" y="266.0" font-size="21" fill="#343a40" text-anchor="middle">⋮</text>
    <text x="420" y="110" font-size="19" fill="#343a40" text-anchor="start">for every φ, exactly one of</text>
    <text x="420" y="140" font-size="19" fill="#343a40" text-anchor="start">φ and ¬φ is in Γ</text>
    <text x="420" y="200" font-size="19" fill="#343a40" text-anchor="start">Γ contains every theorem of Σ</text>
    <text x="420" y="260" font-size="19" fill="#343a40" text-anchor="start">Γ is closed under ⊢Σ</text>
  </g>
</svg>
