name: Build lecture notes

on:
  push:
    branches: [main]
    paths:
      - 'notes/**.md'
      - 'scripts/**'
      - 'shared/notes.css'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.2/pandoc-3.2-1-amd64.deb
          sudo dpkg -i pandoc-3.2-1-amd64.deb

      - name: Convert markdown notes to HTML
        run: bash scripts/convert_notes.sh

      - name: Commit converted HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/*.html
          git diff --cached --quiet || git commit -m "auto: rebuild HTML notes from markdown"
          git push
